<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<title>Personal Development</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#111;font-family:-apple-system,'SF Pro Display',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.eyebrow{font-size:10px;letter-spacing:4px;color:#C8960C;font-weight:800;margin-bottom:14px;text-align:center;font-family:monospace;}
h1{font-size:32px;font-weight:900;margin-bottom:6px;text-align:center;letter-spacing:-0.5px;}
.sub{font-size:14px;color:#555;margin-bottom:48px;text-align:center;}
.apps{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px;}
.app-btn{display:flex;align-items:center;gap:18px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:20px 22px;text-decoration:none;color:#fff;transition:all 0.2s;cursor:pointer;}
.app-btn:hover{background:#222;border-color:#C8960C;}
.app-btn:active{transform:scale(0.98);}
.app-icon{font-size:36px;flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;}
.app-name{font-size:17px;font-weight:800;margin-bottom:4px;}
.app-desc{font-size:12px;color:#555;line-height:1.5;}
.divider{width:100%;max-width:420px;height:1px;background:#1e1e1e;margin:8px 0;}
.footer{margin-top:44px;font-size:10px;color:#2a2a2a;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>

<div class="eyebrow">PERSONAL DEVELOPMENT</div>
<h1>Your Apps</h1>
<p class="sub">Matt Weaver Team · Originate for Life</p>

<div class="apps">

  <a href="planner.html" class="app-btn">
    <div class="app-icon" style="background:#1e1e00;">📋</div>
    <div>
      <div class="app-name">Daily Planner</div>
      <div class="app-desc">Schedule · Outcomes · Frog · Check off blocks throughout the day</div>
    </div>
  </a>

  <a href="blueprint.html" class="app-btn">
    <div class="app-icon" style="background:#1e0a00;">🔥</div>
    <div>
      <div class="app-name">Personal Blueprint</div>
      <div class="app-desc">Goals · Daily schedule · Call 1 OS · Workout plan · Mindset</div>
    </div>
  </a>

</div>

<div class="footer">PFENTON752-BYTE · OFL PLATFORM</div>

</body>
</html>
