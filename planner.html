<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Daily Planner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F4F4F0;--white:#FFFFFF;--border:#E0E0DA;--text:#111111;
  --text2:#444444;--muted:#888888;--gold:#C8960C;--red:#C0392B;
  --purple:#8E44AD;--green:#27AE60;--pink:#E8A0BF;--blue:#2980B9;
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,'SF Pro Display',sans-serif;color:var(--text);overflow-x:hidden;}
.header{background:#111;padding:env(safe-area-inset-top,20px) 16px 16px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.header-label{font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:800;margin-bottom:4px;font-family:monospace;}
.header-date{font-size:20px;font-weight:900;color:#fff;}
.save-btn{padding:8px 16px;border-radius:8px;border:none;background:var(--gold);color:#111;font-size:11px;font-weight:800;cursor:pointer;letter-spacing:0.5px;flex-shrink:0;}
.save-btn.saved{background:var(--green);color:#fff;}
.progress-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.progress-label{font-size:10px;color:#555;font-weight:600;letter-spacing:0.5px;}
.progress-val{font-size:10px;font-weight:700;}
.prog-track{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--gold);transition:width 0.4s;}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:99;overflow-x:auto;}
.tab{padding:12px 16px;font-size:12px;font-weight:700;color:var(--muted);border:none;background:transparent;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:var(--text);border-bottom-color:var(--text);}
.content{padding:14px 16px 100px;max-width:680px;margin:0 auto;}
.outcomes-card{background:#FFFBF0;border:1px solid #DDB830;border-radius:12px;padding:16px;margin-bottom:14px;}
.card-label{font-size:9px;font-weight:800;letter-spacing:2px;margin-bottom:10px;}
.outcome-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.outcome-num{font-size:12px;color:var(--gold);font-weight:900;font-family:monospace;width:22px;flex-shrink:0;}
.outcome-input{flex:1;background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;}
.frog-label{font-size:9px;color:var(--red);font-weight:800;letter-spacing:1.5px;margin-bottom:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(200,150,12,0.2);}
.frog-input{width:100%;background:#FFF5F0;border:1px solid rgba(192,57,43,0.3);border-radius:6px;padding:8px 10px;color:var(--red);font-size:13px;font-weight:600;font-family:inherit;}
.block{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:8px;padding:12px 13px;margin-bottom:7px;transition:opacity 0.2s;}
.block.done{opacity:0.5;}
.block-inner{display:flex;gap:11px;align-items:flex-start;}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all 0.15s;}
.check.checked{background:var(--green);border-color:var(--green);}
.check-mark{font-size:9px;color:#fff;font-weight:900;display:none;}
.check.checked .check-mark{display:block;}
.block-body{flex:1;min-width:0;}
.block-meta{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
.block-time{font-size:11px;color:var(--muted);font-family:monospace;font-weight:700;background:#F0F0EC;padding:2px 6px;border-radius:3px;flex-shrink:0;}
.block-tag{font-size:8px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:3px;flex-shrink:0;}
.block-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3;}
.block.done .block-title{text-decoration:line-through;color:var(--muted);}
.block-note{font-size:12px;color:var(--text2);line-height:1.6;}
.block-actions{display:flex;gap:4px;flex-shrink:0;}
.act{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:#F8F8F4;color:var(--muted);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
.act.del{background:#FFF0F0;border-color:#FFCCCC;color:#CC4444;}
.edit-form{display:flex;flex-direction:column;gap:8px;}
.edit-row{display:flex;gap:7px;}
.edit-input{width:100%;background:#F8F8F4;border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:13px;font-family:inherit;}
.edit-select{flex:1;background:#F8F8F4;border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;}
.edit-time{width:90px;background:#F8F8F4;border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--gold);font-size:12px;font-family:monospace;font-weight:700;}
.edit-textarea{width:100%;background:#F8F8F4;border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text2);font-size:12px;font-family:inherit;resize:vertical;}
.edit-done{background:#111;border:none;color:#fff;padding:8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:800;width:100%;}
.add-section{margin-top:10px;}
.add-btn{width:100%;background:var(--white);border:1px dashed var(--gold);color:var(--gold);padding:12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
.add-form{background:var(--white);border:1px dashed var(--gold);border-radius:10px;padding:16px;margin-top:8px;}
.add-title-label{font-size:9px;color:var(--gold);font-weight:800;letter-spacing:2px;margin-bottom:10px;}
.add-actions{display:flex;gap:8px;margin-top:8px;}
.add-confirm{flex:1;background:#111;border:none;color:#fff;padding:10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:800;}
.add-cancel{background:#F8F8F4;border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:7px;cursor:pointer;font-size:13px;}
.reset-btn{width:100%;background:#FFF5F5;border:1px solid #FFCCCC;color:#CC4444;padding:11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;margin-top:8px;}
.notes-section{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
.notes-textarea{width:100%;background:#F8F8F4;border:1px solid var(--border);border-radius:7px;padding:10px 12px;color:var(--text);font-size:13px;font-family:inherit;line-height:1.7;resize:vertical;}
.goals-list{list-style:none;}
.goal-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #EEEEEE;align-items:flex-start;}
.goal-num{color:#7B68EE;font-family:monospace;font-size:11px;font-weight:800;flex-shrink:0;min-width:24px;}
.goal-text{font-size:13px;color:var(--text);line-height:1.5;}
.chief-aim{font-size:13px;color:#8B6914;line-height:1.85;font-style:italic;font-weight:500;}
.win-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px 16px env(safe-area-inset-bottom,10px);display:flex;justify-content:space-between;align-items:center;z-index:200;}
.bottom-hint{font-size:10px;color:#333;letter-spacing:0.3px;}
.bottom-save{padding:8px 20px;border-radius:7px;border:none;background:var(--gold);color:#111;font-size:12px;font-weight:800;cursor:pointer;}
.bottom-save.saved{background:var(--green);color:#fff;}
/* AI BUILDER */
.ai-builder{background:#1a1a2e;border:2px solid #C8960C;border-radius:14px;padding:18px;margin-bottom:16px;}
.ai-builder-label{font-size:9px;font-weight:800;letter-spacing:2px;color:#C8960C;margin-bottom:10px;}
.ai-builder-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px;}
.ai-builder-sub{font-size:12px;color:#666;margin-bottom:14px;line-height:1.5;}
.ai-upload-area{border:2px dashed #333;border-radius:10px;padding:24px;text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color 0.2s;}
.ai-upload-area:hover{border-color:#C8960C;}
.ai-upload-area.has-image{border-color:#C8960C;background:rgba(200,150,12,0.05);}
.ai-build-btn{width:100%;padding:14px;border-radius:10px;border:none;background:#C8960C;color:#111;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:0.5px;}
.ai-build-btn:disabled{background:#444;color:#666;cursor:default;}
.ai-status{font-size:12px;color:#888;text-align:center;margin-top:10px;min-height:18px;line-height:1.5;}
.ai-status.loading{color:#C8960C;}
.ai-status.success{color:#27AE60;}
.ai-status.error{color:#C0392B;}
/* PIN */
.pin-overlay{position:fixed;inset:0;background:#111;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;}
.pin-label{font-size:9px;letter-spacing:3px;color:#C8960C;font-weight:800;margin-bottom:16px;font-family:monospace;}
.pin-title{font-size:26px;font-weight:900;color:#fff;margin-bottom:8px;}
.pin-sub{font-size:13px;color:#555;margin-bottom:32px;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #333;background:transparent;transition:all 0.15s;}
.pin-dot.filled{background:#C8960C;border-color:#C8960C;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px;}
.pin-btn{height:64px;border-radius:12px;border:1px solid #222;background:#1a1a1a;color:#fff;font-size:22px;font-weight:700;cursor:pointer;transition:all 0.1s;}
.pin-btn:active{background:#2a2a2a;transform:scale(0.95);}
.pin-btn.zero{grid-column:2;}
.pin-btn.del{background:transparent;border-color:#333;color:#555;font-size:16px;}
.pin-error{font-size:13px;color:#C0392B;margin-top:16px;font-weight:700;min-height:20px;}
</style>
</head>
<body>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-label">DAILY PLANNER</div>
  <div class="pin-title">Enter PIN</div>
  <div class="pin-sub">Your planner is private.</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="pd0"></div>
    <div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div>
    <div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pinPress('1')">1</button>
    <button class="pin-btn" onclick="pinPress('2')">2</button>
    <button class="pin-btn" onclick="pinPress('3')">3</button>
    <button class="pin-btn" onclick="pinPress('4')">4</button>
    <button class="pin-btn" onclick="pinPress('5')">5</button>
    <button class="pin-btn" onclick="pinPress('6')">6</button>
    <button class="pin-btn" onclick="pinPress('7')">7</button>
    <button class="pin-btn" onclick="pinPress('8')">8</button>
    <button class="pin-btn" onclick="pinPress('9')">9</button>
    <button class="pin-btn zero" onclick="pinPress('0')">0</button>
    <button class="pin-btn del" onclick="pinDel()">&#x232b;</button>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>

<input type="file" id="calendarUpload" accept="image/*" style="display:none" onchange="handleImageUpload(event)" />

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-label">DAILY OPERATING SYSTEM</div>
      <div class="header-date" id="headerDate">Loading...</div>
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveData()">SAVE</button>
  </div>
  <div id="progressArea">
    <div class="progress-row">
      <span class="progress-label">PROGRESS</span>
      <span class="progress-val" id="progressVal" style="color:var(--gold)">0/0</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('today',this)">&#128203; Today</button>
  <button class="tab" onclick="switchTab('tomorrow',this)">&#9197; Tomorrow</button>
  <button class="tab" onclick="switchTab('notes',this)">&#128221; Notes</button>
</div>

<div class="content" id="mainContent"></div>

<div class="bottom-bar">
  <span class="bottom-hint">4:15 PM &#8594; screenshot calendar &#8594; AI builds tomorrow</span>
  <button class="bottom-save" id="bottomSaveBtn" onclick="saveData()">SAVE</button>
</div>

<script>
var CORRECT_PIN = '1107';
var PIN_SESSION_KEY = 'pin_planner_unlocked';
var pinEntry = '';

function checkPinSession() {
  if(sessionStorage.getItem(PIN_SESSION_KEY) === '1') {
    document.getElementById('pinOverlay').style.display = 'none';
    return true;
  }
  return false;
}

function pinPress(d) {
  if(pinEntry.length >= 4) return;
  pinEntry += d;
  updatePinDots();
  if(pinEntry.length === 4) {
    setTimeout(checkPin, 150);
  }
}

function pinDel() {
  pinEntry = pinEntry.slice(0,-1);
  updatePinDots();
  document.getElementById('pinError').textContent = '';
}

function updatePinDots() {
  for(let i=0;i<4;i++) {
    document.getElementById('pd'+i).classList.toggle('filled', i < pinEntry.length);
  }
}

function checkPin() {
  if(pinEntry === CORRECT_PIN) {
    sessionStorage.setItem(PIN_SESSION_KEY, '1');
    var ov = document.getElementById('pinOverlay');
    ov.style.transition = 'opacity 0.3s';
    ov.style.opacity = '0';
    setTimeout(() => ov.style.display = 'none', 300);
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    pinEntry = '';
    updatePinDots();
    var dots = document.getElementById('pinDots');
    dots.style.transition = 'transform 0.1s';
    dots.style.transform = 'translateX(8px)';
    setTimeout(()=>dots.style.transform='translateX(-8px)',100);
    setTimeout(()=>dots.style.transform='translateX(0)',200);
  }
}

if(!checkPinSession()) {
  document.getElementById('pinOverlay').style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', function() {
  if(!checkPinSession()) {
    document.getElementById('pinOverlay').style.display = 'flex';
  }
});



// ── PIN LOCK ─────────────────────────────────────────────
// ─── STATE ──────────────────────────────────────────────
let API_KEY = '$2a$10$NyyXvn9j8.HX5rM0oKCjnuo9GxmQVT/hRnTLslt.ks00E/ViRfF0G';
let BIN_ID  = localStorage.getItem('jsonbin_bin') || '';
let currentTab = 'today';
let editingId = null;
let showAddForm = false;
let newBlock = {time:'',type:'LO_PROSPECT',title:'',note:''};

// AI Builder state
let aiImageBase64 = '';
let aiBuilding = false;
let aiStatus = {type:'', msg:''};

// ─── AI SCHEDULE BUILDER ─────────────────────────────────
function handleImageUpload(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    aiImageBase64 = e.target.result; // full data URL
    aiStatus = {type:'', msg:'Calendar loaded. Tap Build My Schedule.'};
    render();
  };
  reader.readAsDataURL(file);
}

async function buildScheduleWithAI() {
  if(!aiImageBase64 || aiBuilding) return;
  aiBuilding = true;
  aiStatus = {type:'loading', msg:'Claude is reading your calendar and building your schedule...'};
  render();

  try {
    // Get tomorrow's date info
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dayName = dayNames[tomorrow.getDay()];
    const gymDays = {Monday:'Chest + Triceps', Tuesday:'Back + Biceps', Wednesday:'Shoulders + Core', Thursday:'Lower Body + Back', Friday:'Full Body', Saturday:'Active Recovery', Sunday:'Rest'};
    const gymDay = gymDays[dayName] || 'Rest';

    // Extract base64 data only
    const base64Data = aiImageBase64.split(',')[1];
    const mediaType = aiImageBase64.split(';')[0].split(':')[1];

    const systemPrompt = `You are a scheduling assistant for a recruiting operator at CrossCountry Mortgage on the Matt Weaver Team (Originate for Life platform). 

The user runs two recruiting tracks:
- LO TRACK: qualifying loan originators for the Advisor seat. Paladin does warm outreach first, then this person runs Call 1 (qualification + income goal conversation), then Call 2 (pro forma walkthrough), then Call 3 (peer validation with Mike Reed and Dave Leibowitz), then Call 4 (decision conversation). Income goals MUST be surfaced before showing any comp model.
- RE TRACK: outreach to real estate teams for formal BD partnerships. Pat Fenton leads this track. Never mix RE and LO outreach.

Their daily schedule framework:
- Wake 6 AM, gym 7 AM (${dayName} = ${gymDay}), office by 9 AM
- Morning peak window 9-11 AM = LO Prospecting (new outreach, Paladin handoffs)
- 10:40 AM = LO Follow-Up (Day 1/3/7/14 cadence)
- 12:20 PM = RE Prospecting block
- Afternoon = research, follow-up block 2, scheduled calls, pipeline audit
- 4:15 PM = Plan tomorrow, 4:30 PM hard stop

BLOCK TYPES available: LO_PROSPECT, RE_PROSPECT, FOLLOWUP, DECISION, SCHEDULED, PIPELINE, RESEARCH, ADMIN, READING, NUTRITION, GYM, ROUTINE, BREAK, REVIEW

Look at the calendar screenshot and identify all appointments for ${dayName}. Build a complete day schedule that:
1. Keeps the standard morning routine (wake, affirmations, goals, reading, gym, shower, meal, drive)
2. Places each calendar appointment at its exact time with the correct block type
3. For each appointment, identify if it's LO or RE track and use the right block type (DECISION for decision calls, SCHEDULED for other calls, RE_PROSPECT for RE meetings)
4. Fills gaps intelligently with LO_PROSPECT, FOLLOWUP, RESEARCH, PIPELINE blocks
5. Includes nutrition blocks and the evening routine

Return ONLY a valid JSON array of blocks. No explanation, no markdown, just the raw JSON array.

Each block must have: id (unique string like "ai1", "ai2" etc), time (like "9:00 AM"), type (from the list above), title (clear specific name), note (specific context/objective for that block), done (false)

For appointment blocks, include the person's name in the title and their context in the note (e.g. what stage they're at, what the objective of the call is).`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 4000,
        system: systemPrompt,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: {
                type: 'base64',
                media_type: mediaType,
                data: base64Data
              }
            },
            {
              type: 'text',
              text: `This is my calendar for tomorrow, ${dayName}. Build my complete day schedule as a JSON array of blocks. Include all appointments you can see plus fill the open windows with the right work blocks. Be specific about each appointment — what it is, who it's with, and what the objective is.`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    
    if(data.error) throw new Error(data.error.message);

    const text = data.content[0].text;
    
    // Parse JSON from response
    let blocks;
    try {
      // Try to find JSON array in response
      const match = text.match(/\[[\s\S]*\]/);
      if(!match) throw new Error('No JSON found');
      blocks = JSON.parse(match[0]);
    } catch(e) {
      throw new Error('Could not parse schedule from Claude response');
    }

    // Validate and clean blocks
    const validTypes = Object.keys(TYPES);
    blocks = blocks.map((b, i) => ({
      id: b.id || 'ai'+i,
      time: b.time || '9:00 AM',
      type: validTypes.includes(b.type) ? b.type : 'SCHEDULED',
      title: b.title || 'Block',
      note: b.note || '',
      done: false
    }));

    // Sort by time
    blocks.sort((a,b) => toMin(a.time) - toMin(b.time));

    // Set as tomorrow's schedule
    STATE.tomorrow.blocks = blocks;

    aiBuilding = false;
    aiStatus = {type:'success', msg:`✓ Schedule built — ${blocks.length} blocks created from your calendar. Review and hit Save.`};
    aiImageBase64 = '';
    
    await saveToCloud();
    render();

  } catch(e) {
    aiBuilding = false;
    aiStatus = {type:'error', msg:'Error: ' + (e.message || 'Something went wrong. Try again.')};
    render();
  }
}

const dayKey = (off=0) => {
  const d = new Date(); d.setDate(d.getDate()+off);
  return `day-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
};

let STATE = {
  today: {blocks: TEMPLATE.map(b=>({...b,done:false})), outcomes:['','',''], frog:'', wins:['','',''], notes:''},
  tomorrow: {blocks: TEMPLATE.map(b=>({...b,done:false,id:'t'+Math.random().toString(36).slice(2,8)})), outcomes:['','',''], frog:''},
};

// ─── JSONBIN API ─────────────────────────────────────────
async function loadFromCloud() {
  if(!API_KEY) return;
  try {
    if(!BIN_ID) {
      // Create new bin
      const r = await fetch('https://api.jsonbin.io/v3/b', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':API_KEY,'X-Bin-Name':'planner-data'},
        body: JSON.stringify(STATE)
      });
      const d = await r.json();
      if(d.metadata?.id) { BIN_ID = d.metadata.id; localStorage.setItem('jsonbin_bin', BIN_ID); }
    } else {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers:{'X-Master-Key':API_KEY}
      });
      const d = await r.json();
      if(d.record) STATE = d.record;
    }
  } catch(e) { console.log('Cloud load failed, using local'); }
}

async function saveToCloud() {
  if(!API_KEY || !BIN_ID) { localStorage.setItem('planner_state', JSON.stringify(STATE)); return false; }
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body: JSON.stringify(STATE)
    });
    localStorage.setItem('planner_state', JSON.stringify(STATE));
    return true;
  } catch(e) { localStorage.setItem('planner_state', JSON.stringify(STATE)); return false; }
}

function saveApiKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if(!k) return;
  API_KEY = k;
  localStorage.setItem('jsonbin_key', k);
  document.getElementById('setupOverlay').style.display = 'none';
  loadFromCloud().then(render);
}

function skipSetup() {
  const saved = localStorage.getItem('planner_state');
  if(saved) try { STATE = JSON.parse(saved); } catch(e) {}
  document.getElementById('setupOverlay').style.display = 'none';
  render();
}

// ─── SAVE ────────────────────────────────────────────────
async function saveData() {
  const btn = document.getElementById('saveBtn');
  const btn2 = document.getElementById('bottomSaveBtn');
  btn.textContent = '...'; btn2.textContent = '...';
  const ok = await saveToCloud();
  btn.textContent = ok ? '✓ SAVED' : '✓ LOCAL';
  btn2.textContent = ok ? '✓ SAVED' : '✓ LOCAL';
  btn.classList.add('saved'); btn2.classList.add('saved');
  setTimeout(()=>{ btn.textContent='SAVE'; btn2.textContent='SAVE'; btn.classList.remove('saved'); btn2.classList.remove('saved'); }, 2500);
}

// ─── RENDER ──────────────────────────────────────────────
function render() {
  updateHeader();
  const c = document.getElementById('mainContent');
  if(currentTab === 'today' || currentTab === 'tomorrow') {
    renderDayTab(c, currentTab);
  } else {
    renderNotesTab(c);
  }
}

function updateHeader() {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const d = new Date();
  document.getElementById('headerDate').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();

  if(currentTab === 'notes') {
    document.getElementById('progressArea').style.display = 'none';
    return;
  }
  document.getElementById('progressArea').style.display = 'block';
  const data = STATE[currentTab];
  const done = data.blocks.filter(b=>b.done).length;
  const total = data.blocks.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressVal').textContent = `${done}/${total} — ${pct}%`;
  document.getElementById('progressVal').style.color = pct>=80?'var(--green)':pct>=50?'var(--gold)':'var(--muted)';
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progFill').style.background = pct>=80?'var(--green)':'var(--gold)';
}

function renderDayTab(c, tabKey) {
  const data = STATE[tabKey];
  const label = tabKey === 'today' ? "TODAY'S" : "TOMORROW'S";
  let html = '';

  // AI Builder — only show on tomorrow tab
  if(tabKey === 'tomorrow') {
    html += `<div class="ai-builder">
      <div class="ai-builder-label">✨ AI SCHEDULE BUILDER</div>
      <div class="ai-builder-title">Build Tomorrow From Your Calendar</div>
      <div class="ai-builder-sub">Upload a screenshot of tomorrow's calendar and Claude will build your complete schedule around your appointments automatically.</div>
      <div class="ai-upload-area${aiImageBase64?' has-image':''}" onclick="document.getElementById('calendarUpload').click()" id="uploadArea">
        ${aiImageBase64
          ? `<div class="ai-upload-icon">📅</div><div class="ai-upload-text">Calendar loaded — tap Build Schedule</div><div class="ai-upload-hint">Tap here to change image</div>`
          : `<div class="ai-upload-icon">📸</div><div class="ai-upload-text">Tap to upload calendar screenshot</div><div class="ai-upload-hint">Screenshot your calendar app and upload it here</div>`
        }
      </div>
      ${aiImageBase64 ? `<img id="aiPreview" src="${aiImageBase64}" style="width:100%;max-height:160px;object-fit:contain;border-radius:8px;margin-bottom:12px;" />` : ''}
      <button class="ai-build-btn" onclick="buildScheduleWithAI()" ${aiBuilding||!aiImageBase64?'disabled':''}>
        ${aiBuilding ? '⏳ Building your schedule...' : '⚡ Build My Schedule'}
      </button>
      <div class="ai-status ${aiStatus.type}" id="aiStatus">${aiStatus.msg}</div>
    </div>`;
  }

  // Outcomes
  html += `<div class="outcomes-card">
    <div class="card-label" style="color:var(--gold)">${label} 3 OUTCOMES</div>
    ${[0,1,2].map(i=>`
      <div class="outcome-row">
        <span class="outcome-num">0${i+1}</span>
        <input class="outcome-input" value="${esc(data.outcomes?.[i]||'')}" oninput="STATE['${tabKey}'].outcomes[${i}]=this.value" placeholder="Specific pipeline action ${i+1}..." />
      </div>`).join('')}
    <div class="frog-label">THE FROG — MOST IMPORTANT ACTION</div>
    <input class="frog-input" value="${esc(data.frog||'')}" oninput="STATE['${tabKey}'].frog=this.value" placeholder="The single highest-leverage thing you must do today..." />
  </div>`;

  // Blocks
  data.blocks.forEach(b => {
    const ty = TYPES[b.type]||TYPES.ROUTINE;
    if(editingId === b.id) {
      html += renderEditBlock(b, tabKey);
    } else {
      html += `<div class="block${b.done?' done':''}" style="border-left-color:${ty.bg}" id="blk-${b.id}">
        <div class="block-inner">
          <div class="check${b.done?' checked':''}" onclick="toggleBlock('${tabKey}','${b.id}')">
            <span class="check-mark">✓</span>
          </div>
          <div class="block-body">
            <div class="block-meta">
              <span class="block-time">${b.time}</span>
              <span class="block-tag" style="color:${ty.color};background:${ty.bg}">${ty.label}</span>
            </div>
            <div class="block-title">${esc(b.title)}</div>
            ${b.note?`<div class="block-note">${esc(b.note)}</div>`:''}
          </div>
          <div class="block-actions">
            <div class="act" onclick="startEdit('${b.id}')">✎</div>
            <div class="act del" onclick="deleteBlock('${tabKey}','${b.id}')">×</div>
          </div>
        </div>
      </div>`;
    }
  });

  // Add form
  html += `<div class="add-section">`;
  if(showAddForm) {
    html += `<div class="add-form">
      <div class="add-title-label">NEW BLOCK</div>
      <div class="edit-row">
        <input class="edit-time" id="nb-time" value="${newBlock.time}" oninput="newBlock.time=this.value" placeholder="9:00 AM" />
        <select class="edit-select" id="nb-type" onchange="newBlock.type=this.value">
          ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${newBlock.type===k?' selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <input class="edit-input" id="nb-title" value="${newBlock.title}" oninput="newBlock.title=this.value" placeholder="Block title — e.g. Ken Nastasi Decision Call" style="margin-top:7px;" />
      <textarea class="edit-textarea" id="nb-note" rows="2" oninput="newBlock.note=this.value" placeholder="Candidate name, phone, objective..." style="margin-top:7px;">${newBlock.note}</textarea>
      <div class="add-actions">
        <button class="add-confirm" onclick="addBlock('${tabKey}')">+ Add Block</button>
        <button class="add-cancel" onclick="showAddForm=false;render()">Cancel</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-btn" onclick="showAddForm=true;render()">+ Add Block</button>`;
  }
  html += `<button class="reset-btn" onclick="resetDay('${tabKey}')">Reset to Default Schedule</button></div>`;

  c.innerHTML = html;
}

function renderEditBlock(b, tabKey) {
  return `<div class="block" style="border-left-color:var(--gold)">
    <div class="edit-form">
      <div class="edit-row">
        <input class="edit-time" value="${b.time}" oninput="updateBlock('${tabKey}','${b.id}','time',this.value)" />
        <select class="edit-select" onchange="updateBlock('${tabKey}','${b.id}','type',this.value)">
          ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${b.type===k?' selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <input class="edit-input" value="${esc(b.title)}" oninput="updateBlock('${tabKey}','${b.id}','title',this.value)" />
      <textarea class="edit-textarea" rows="2" oninput="updateBlock('${tabKey}','${b.id}','note',this.value)">${esc(b.note||'')}</textarea>
      <button class="edit-done" onclick="editingId=null;render()">Done Editing</button>
    </div>
  </div>`;
}

function renderNotesTab(c) {
  const d = STATE.today;
  let html = '';

  // Chief Aim
  html += `<div class="notes-section">
    <div class="card-label" style="color:var(--gold);margin-bottom:8px;">CHIEF AIM — READ OUT LOUD EVERY MORNING</div>
    <p class="chief-aim">"By May 12, 2027 I earn $250,000 or more annually, I live in my first home with Grace, I weigh 195 lbs, I am debt-free, and I am healthy, confident, and happy. I achieve this by executing my daily system without negotiation, every single day."</p>
  </div>`;

  // 10 Goals
  html += `<div class="notes-section">
    <div class="card-label" style="color:#7B68EE;margin-bottom:10px;">10 GOALS — REWRITE BY HAND EVERY MORNING</div>
    <ul class="goals-list">
      ${GOALS.map((g,i)=>`<li class="goal-item"><span class="goal-num">${String(i+1).padStart(2,'0')}</span><span class="goal-text">${g}</span></li>`).join('')}
    </ul>
  </div>`;

  // 3 Wins
  html += `<div class="notes-section" style="background:#F0FBF6;border-color:#A9DFBF;">
    <div class="card-label" style="color:#1E8449;margin-bottom:10px;">3 WINS TODAY — WRITE EVERY NIGHT</div>
    ${[0,1,2].map(i=>`
      <div class="win-row">
        <span style="font-size:14px">🔥</span>
        <input class="outcome-input" style="background:rgba(255,255,255,0.8);border-color:#A9DFBF;" value="${esc(d.wins?.[i]||'')}" oninput="STATE.today.wins[${i}]=this.value" placeholder="Win ${i+1}..." />
      </div>`).join('')}
  </div>`;

  // Daily notes
  html += `<div class="notes-section">
    <div class="card-label" style="color:var(--blue);margin-bottom:8px;">DAILY NOTES</div>
    <textarea class="notes-textarea" rows="6" oninput="STATE.today.notes=this.value" placeholder="What happened today? What did you learn? What would you do differently?">${esc(d.notes||'')}</textarea>
  </div>`;

  // Block legend
  html += `<div class="notes-section">
    <div class="card-label" style="color:var(--muted);margin-bottom:10px;">BLOCK TYPE LEGEND</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${Object.entries(TYPES).map(([k,v])=>`<span style="font-size:9px;font-weight:800;color:${v.color};background:${v.bg};padding:4px 10px;border-radius:4px;">${v.label}</span>`).join('')}
    </div>
  </div>`;

  c.innerHTML = html;
}

// ─── ACTIONS ─────────────────────────────────────────────
function toggleBlock(tab, id) {
  const b = STATE[tab].blocks.find(x=>x.id===id);
  if(b) b.done = !b.done;
  render();
}

function startEdit(id) { editingId = id; showAddForm = false; render(); }

function updateBlock(tab, id, field, val) {
  const b = STATE[tab].blocks.find(x=>x.id===id);
  if(b) b[field] = val;
}

function deleteBlock(tab, id) {
  if(!confirm('Delete this block?')) return;
  STATE[tab].blocks = STATE[tab].blocks.filter(x=>x.id!==id);
  render();
}

function addBlock(tab) {
  if(!newBlock.time || !newBlock.title) { alert('Add a time and title'); return; }
  const block = {...newBlock, id:'u'+Math.random().toString(36).slice(2,8), done:false};
  STATE[tab].blocks.push(block);
  STATE[tab].blocks.sort((a,b)=>toMin(a.time)-toMin(b.time));
  newBlock = {time:'',type:'LO_PROSPECT',title:'',note:''};
  showAddForm = false;
  render();
}

function resetDay(tab) {
  if(!confirm('Reset to default schedule?')) return;
  STATE[tab].blocks = TEMPLATE.map(b=>({...b,done:false,id:'t'+Math.random().toString(36).slice(2,8)}));
  render();
}

function toMin(t) {
  if(!t) return 9999;
  const p = t.trim().split(' ');
  const mer = p[1]||'AM';
  const [hh,mm] = (p[0]||'0:0').split(':').map(Number);
  let h = hh;
  if(mer==='PM'&&h!==12) h+=12;
  if(mer==='AM'&&h===12) h=0;
  return h*60+(mm||0);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(tab, el) {
  currentTab = tab;
  editingId = null;
  showAddForm = false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ─── INIT ────────────────────────────────────────────────
window.onload = () => {
  loadFromCloud().then(render);
};

</script>
</body>
</html>
